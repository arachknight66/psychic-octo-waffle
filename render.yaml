services:
  - type: web
    name: learnwell-api
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm run start:api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: https://learnwell-web.onrender.com
      - key: RECOMMENDER_URL
        value: https://learnwell-recommender.onrender.com

  - type: web
    name: learnwell-recommender
    runtime: python
    plan: free
    buildCommand: pip install -r recommender/requirements.txt
    startCommand: uvicorn app:app --app-dir recommender --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0

  - type: web
    name: learnwell-web
    runtime: static
    buildCommand: npm ci && npm run build -w client
    staticPublishPath: client/dist
    envVars:
      - key: VITE_API_URL
        value: https://learnwell-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
